// userchrome-reload
(function () {
  const { classes: Cc, interfaces: Ci, results: Cr, manager: Cm } = Components;

  function log(msg) {
    Cc["@mozilla.org/consoleservice;1"]
      .getService(Ci.nsIConsoleService)
      .logStringMessage("reload-userchrome: " + msg);
  }

  const fph = Cc["@mozilla.org/network/protocol;1?name=file"]
    .getService(Ci.nsIFileProtocolHandler);

  function findSheets(sheet, name, seen = new Set(), out = []) {
    if (seen.has(sheet)) {
      return out;
    }
    seen.add(sheet);
    if (sheet.href?.endsWith(name)) {
      out.push(sheet);
    }
    for (const rule of sheet.cssRules) {
      if (rule.type === 3 && rule.styleSheet) { // CSSRule.IMPORT_RULE
        findSheets(rule.styleSheet, name, seen, out);
      }
    }
    return out;
  }

  async function reloadWindow(win) {
    const root = win.InspectorUtils.getAllStyleSheets(win.document, false)
      .find(s => s.href?.endsWith("/chrome/userChrome.css"));
    const sheets = root ? findSheets(root, "/colors.css") : [];
    if (!sheets.length) {
      log("colors.css not found in a window");
      return;
    }
    const path = fph.getFileFromURLSpec(sheets[0].href).path;
    const text = await win.IOUtils.readUTF8(path);
    for (const sheet of sheets) {
      win.InspectorUtils.parseStyleSheet(sheet, text);
    }
    // Changing an inherited custom property on the root forces a full-tree
    // restyle, which schedules a repaint without needing input.
    const de = win.document.documentElement;
    de.style.setProperty("--uc-reload-tick", String(Date.now()));
    win.getComputedStyle(de).getPropertyValue("--uc-reload-tick");
  }

  async function reloadUserChrome() {
    const wm = Cc["@mozilla.org/appshell/window-mediator;1"]
      .getService(Ci.nsIWindowMediator);
    let count = 0;
    for (const win of wm.getEnumerator("navigator:browser")) {
      await reloadWindow(win);
      count++;
    }
    log(`reloaded ${count} window(s)`);
  }

  const handler = {
    handle(cmdLine) {
      if (!cmdLine.handleFlag("reload-userchrome", false)) {
        return;
      }
      if (cmdLine.state !== Ci.nsICommandLine.STATE_INITIAL_LAUNCH) {
        cmdLine.preventDefault = true;
        reloadUserChrome().catch(e => log(e));
      }
    },
    helpInfo: "  --reload-userchrome  Reload colors.css in all browser windows\n",
    QueryInterface(iid) {
      if (iid.equals(Ci.nsICommandLineHandler) || iid.equals(Ci.nsISupports)) {
        return this;
      }
      throw Cr.NS_ERROR_NO_INTERFACE;
    },
  };

  const contractID = "@local/reload-userchrome-clh;1";
  Cm.QueryInterface(Ci.nsIComponentRegistrar).registerFactory(
    Components.ID("{3f6a9d2e-8b41-4c7e-9a55-1d2f7c0e4b18}"),
    "Reload userChrome command line handler",
    contractID,
    { createInstance: iid => handler.QueryInterface(iid) }
  );
  Cc["@mozilla.org/categorymanager;1"]
    .getService(Ci.nsICategoryManager)
    .addCategoryEntry("command-line-handler", "a-reload-userchrome", contractID, false, true);
})();
